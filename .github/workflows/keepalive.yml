# Keeps the deployed radar awake.
#
# Render's free plan spins a web service down after ~15 minutes without inbound traffic, and a
# sleeping radar detects no launches and sends no alerts — which is the whole product. The free
# plan also includes 750 instance-hours a month and a month is about 730 hours, so a service that
# never sleeps still fits inside the allowance.
#
# This repo is public, so Actions minutes are free and unlimited. Pinging every 10 minutes keeps
# the service under the 15-minute idle timeout with room for a late run.
#
# Set the URL once: repo → Settings → Secrets and variables → Actions → Variables → New variable
#   HEALTH_URL = https://memicoinradar.onrender.com/api/health
# Without it the workflow skips instead of failing, so a fresh clone is not noisy.

name: Keep the radar awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# A late run must never stack on top of a running one.
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health endpoint
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "HEALTH_URL variable is not set — nothing to ping yet."
            echo "Set it under Settings → Secrets and variables → Actions → Variables."
            exit 0
          fi

          # A cold start takes 30-60s, so allow time and retry rather than failing on the wake-up.
          body=$(curl --silent --show-error --fail \
                      --retry 4 --retry-delay 20 --retry-all-errors \
                      --max-time 90 \
                      "$HEALTH_URL")

          echo "$body"

          # A 200 that reports zero tracked coins means the process is up but the monitor is not
          # reaching pump.fun — worth seeing in the run list rather than passing silently.
          tokens=$(printf '%s' "$body" | sed -n 's/.*"tokens":\([0-9]*\).*/\1/p')
          if [ "${tokens:-0}" -eq 0 ]; then
            echo "::warning::Service is up but tracking 0 coins — the monitor may not be connected."
          else
            echo "Awake, tracking $tokens coins."
          fi
