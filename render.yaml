# Deploy straight from GitHub: render.com → New → Blueprint → pick this repo.
# The service is named MemicoinRadar, so the URL is https://memicoinradar.onrender.com
# (Render appends a suffix if that name is already taken by someone else).
#
# Free tier trade-offs, so they are not a surprise:
#   • The service sleeps after ~15 minutes without traffic and takes ~30-60s to wake. While it
#     sleeps no launches are detected and no Telegram alerts go out — it is a shareable link,
#     not a 24/7 radar. Paid plans ($7/mo) do not sleep.
#   • There is no persistent disk, so the database starts empty after every deploy or restart:
#     accounts, watchlists, paper trades and payment records do not survive. Upgrade the plan and
#     attach a disk mounted at /data (then set DATABASE_PATH=/data/radar.db) to keep them.
services:
  - type: web
    name: memicoinradar
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Used for verification and reset links, and for the links in Telegram messages. Sign-in
      # itself works without it — the server also accepts its own host as a same origin.
      - key: APP_URL
        value: https://memicoinradar.onrender.com
      # Signup works without an email provider; set RESEND_API_KEY and flip this to require it.
      - key: REQUIRE_EMAIL_VERIFICATION
        value: 'false'
      # Generated once by Render and kept secret. Changing them signs everyone out.
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Writable path inside the container. Ephemeral on the free plan — see the note above.
      - key: DATABASE_PATH
        value: /app/data/radar.db
      # Set these in the Render dashboard rather than here: they are secrets.
      #   TELEGRAM_BOT_TOKEN   — buy signals to your chat
      #   SOLANA_RPC_URL       — a dedicated RPC; without it holder data stays unavailable
      #   USDT_TRC20_ADDRESS   — Pro payments, wallet you control
      #   TRONGRID_API_KEY     — confirms those payments on-chain
      #   PRO_EMAILS           — your own account, so Pro features are visible without paying
